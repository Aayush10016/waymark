name: trail-local

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    container_name: trail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRAIL_POSTGRES_DB:?TRAIL_POSTGRES_DB is required}
      POSTGRES_USER: ${TRAIL_POSTGRES_USER:?TRAIL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${TRAIL_POSTGRES_PASSWORD:?TRAIL_POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${TRAIL_POSTGRES_PORT:-5432}:5432"
    volumes:
      - trail-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - trail-local

volumes:
  trail-postgres-data:
    name: trail-postgres-data

networks:
  trail-local:
    name: trail-local
    driver: bridge

