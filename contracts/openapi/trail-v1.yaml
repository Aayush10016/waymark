        promptEligibility:
          $ref: "#/components/schemas/CaptureStatePromptEligibility"
        recommendation:
          $ref: "#/components/schemas/CaptureStateRecommendationSummary"
        policyFreshness:
          $ref: "#/components/schemas/CaptureStatePolicyFreshness"
    CaptureStateCurrentCandidate:
      type: object
      additionalProperties: false
      required:
        - problemSessionId
        - status
        - startedAt
        - updatedAt
      properties:
        problemSessionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - CANDIDATE
            - REVIEWABLE
        title:
          type: string
          maxLength: 200
          nullable: true
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CaptureStatePromptEligibility:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum:
            - ELIGIBLE
            - INELIGIBLE
        reason:
          type: string
          enum:
            - CONSENT_REQUIRED
            - NO_CURRENT_CANDIDATE
            - CURRENT_CANDIDATE_READY
    CaptureStateRecommendationSummary:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        currentProblemSessionId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - DETAIL_ENDPOINT_REQUIRED
            - NO_CURRENT_CANDIDATE
            - RECOMMENDATION_DISABLED
    CaptureStatePolicyFreshness:
      type: object
      additionalProperties: false
      required:
        - requiredPolicyVersion
        - fresh
      properties:
        requiredPolicyVersion:
          type: string
        observedPolicyVersion:
          type: string
          nullable: true
        fresh:
          type: boolean
    ProblemSessionSearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          maxLength: 240
          nullable: true
          description: Sensitive search text sent only in the request body.
        filters:
          $ref: "#/components/schemas/ProblemSessionSearchFilters"
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        cursor:
          type: string
          nullable: true
          description: Opaque cursor pinned to the normalized query and filter fingerprint.
    ProblemSessionSearchFilters:
      type: object
      additionalProperties: false
      properties:
        technologies:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 240
          default: []
        errorPhrases:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 240
          default: []
        problemTypes:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 240
          default: []
    ProblemSessionSearchResponse:
      type: object
      additionalProperties: false
      required:
        - results
        - degradationMode
      properties:
        results:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ProblemSessionSearchResult"
        nextCursor:
          type: string
          nullable: true
        degradationMode:
          $ref: "#/components/schemas/SearchDegradationMode"
    ProblemSessionSearchResult:
      type: object
      additionalProperties: false
      required:
        - problemSessionId
        - finalSolution
        - technologies
        - errorPhrases
        - evidenceCodes
        - updatedAt
      properties:
        problemSessionId:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          maxLength: 200
        finalSolution:
          type: string
        generatedSummary:
          type: string
          nullable: true
        technologies:
          type: array
          items:
            type: string
        errorPhrases:
          type: array
          items:
            type: string
        problemType:
          type: string
          nullable: true
        evidenceCodes:
          type: array
          items:
            $ref: "#/components/schemas/SearchEvidenceCode"
        updatedAt:
          type: string
          format: date-time
    SearchEvidenceCode:
      type: string
      enum:
        - LEXICAL_TEXT
        - ERROR_PHRASE
        - TECHNOLOGY
    SearchDegradationMode:
      type: string
      enum:
        - LEXICAL
    ProblemRecommendationDetailResponse:
      type: object
      additionalProperties: false
      required:
        - recommendationId
        - currentProblemSessionId
        - recommendedProblemSessionId
        - strength
        - finalSolution
        - algorithmVersion
        - evidence
        - whyThis
      properties:
        recommendationId:
          type: string
          format: uuid
        currentProblemSessionId:
          type: string
          format: uuid
        recommendedProblemSessionId:
          type: string
          format: uuid
        strength:
          $ref: "#/components/schemas/ProblemRecommendationStrength"
        title:
          type: string
          maxLength: 200
          nullable: true
        finalSolution:
          type: string
          description: Exact user-authored final solution from the prior solved Problem Session.
        solvedAt:
          type: string
          format: date-time
          nullable: true
        durationSeconds:
          type: integer
          minimum: 0
          nullable: true
        algorithmVersion:
          type: string
        evidence:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProblemRecommendationEvidence"
        whyThis:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: "#/components/schemas/ProblemRecommendationWhyThisMessage"
    ProblemRecommendationStrength:
      type: string
      enum:
        - STRONG
        - POSSIBLE
    ProblemRecommendationEvidence:
      type: object
      additionalProperties: false
      required:
        - evidenceCode
        - problemSessionId
      properties:
        evidenceCode:
          $ref: "#/components/schemas/SimilarityEvidenceCode"
        problemSessionId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
          nullable: true
    ProblemRecommendationWhyThisMessage:
      type: object
      additionalProperties: false
      required:
        - evidenceCode
        - problemSessionId
        - message
      properties:
        evidenceCode:
          $ref: "#/components/schemas/SimilarityEvidenceCode"
        problemSessionId:
          type: string
          format: uuid
        artifactId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
    SimilarityEvidenceCode:
      type: string
      enum:
        - VECTOR_DISTANCE
        - LEXICAL_TEXT
        - ERROR_PHRASE
        - TECHNOLOGY
    RecommendationEventRequest:
      type: object
      additionalProperties: false
      required:
        - outcome
      properties:
        outcome:
          $ref: "#/components/schemas/ClientRecommendationEventOutcome"
    RecommendationEventResponse:
