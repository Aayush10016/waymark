        status:
          $ref: "#/components/schemas/RecommendationEventWriteStatus"
    ClientRecommendationEventOutcome:
      type: string
      enum:
        - OPENED
        - HELPFUL
        - NOT_RELATED
        - DISMISSED
    RecommendationEventWriteStatus:
      type: string
      enum:
        - ACCEPTED
        - DUPLICATE
    StartProblemSessionRequest:
      type: object
      additionalProperties: false
      properties:
        problemSessionId:
          type: string
          format: uuid
          nullable: true
          description: Optional client-generated ID used for idempotent manual starts.
        title:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
    FinishProblemSessionRequest:
      type: object
      additionalProperties: false
      properties:
        finishedAt:
          type: string
          format: date-time
          nullable: true
    SaveProblemSessionSolutionRequest:
      type: object
      additionalProperties: false
      required:
        - finalSolution
      properties:
        finalSolution:
          type: string
          minLength: 1
          description: Exact user-authored final solution text.
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          description: Current password used only for reauthentication.
    AccountDeletionResponse:
      type: object
      additionalProperties: false
      required:
        - status
