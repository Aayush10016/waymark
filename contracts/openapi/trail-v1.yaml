        - clientEventId
      properties:
        clientEventId:
          type: string
    CaptureDuplicateEvent:
      type: object
      additionalProperties: false
      required:
        - clientEventId
      properties:
        clientEventId:
          type: string
    CaptureRejectedEvent:
      type: object
      additionalProperties: false
      required:
        - clientEventId
        - code
      properties:
        clientEventId:
          type: string
          nullable: true
        code:
          $ref: "#/components/schemas/CaptureEventRejectionCode"
    CaptureEventRejectionCode:
      type: string
      enum:
        - CONSENT_REQUIRED
        - INVALID_CLIENT_EVENT_ID
        - INVALID_CLIENT_INSTANCE_ID
        - INVALID_EVENT_TIME
        - INVALID_METADATA
        - INVALID_URL
        - UNSAFE_URL
    CaptureStateSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - promptEligibility
        - recommendation
        - policyFreshness
      properties:
        currentCandidate:
          $ref: "#/components/schemas/CaptureStateCurrentCandidate"
