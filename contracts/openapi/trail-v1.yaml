        accepted:
          type: array
          items:
            $ref: "#/components/schemas/CaptureAcceptedEvent"
        duplicate:
          type: array
          items:
            $ref: "#/components/schemas/CaptureDuplicateEvent"
        rejected:
          type: array
          items:
            $ref: "#/components/schemas/CaptureRejectedEvent"
    CaptureAcceptedEvent:
      type: object
