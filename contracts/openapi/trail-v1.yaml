      additionalProperties: false
      required:
        - id
        - status
        - source
        - version
        - startedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProblemSessionStatus"
        source:
          $ref: "#/components/schemas/ProblemSessionSource"
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    ProblemSessionDetailResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - source
        - version
        - startedAt
        - updatedAt
        - artifacts
        - omittedArtifactCount
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProblemSessionStatus"
        source:
          $ref: "#/components/schemas/ProblemSessionSource"
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          nullable: true
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 4000
        localNote:
          type: string
          nullable: true
          maxLength: 4000
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
        artifacts:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SessionArtifactDetailResponse"
        omittedArtifactCount:
          type: integer
          minimum: 0
          description: Number of active artifacts omitted after applying the response bound.
    ProblemSessionSolutionResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - source
        - version
        - finalSolution
        - finalSolutionAuthor
        - solutionAuthoredAt
        - startedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ProblemSessionStatus"
        source:
          $ref: "#/components/schemas/ProblemSessionSource"
        version:
          type: integer
          format: int64
          minimum: 0
        title:
          type: string
          nullable: true
          maxLength: 200
        finalSolution:
          type: string
          description: Exact user-authored final solution text.
        finalSolutionAuthor:
          type: string
          enum:
            - USER
        solutionAuthoredAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
    SessionArtifactDetailResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - position
        - artifactType
        - occurredAt
        - decisive
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          description: Stable active display position.
        artifactType:
          $ref: "#/components/schemas/SessionArtifactType"
        sanitizedUrl:
          type: string
          nullable: true
          maxLength: 2048
          description: Sanitized HTTP(S) URL copied into durable session artifacts.
        hostname:
          type: string
          nullable: true
          maxLength: 253
        title:
          type: string
          nullable: true
          maxLength: 120
        queryText:
          type: string
          nullable: true
          maxLength: 240
          description: Optional allowlisted bounded search text copied into durable session artifacts.
        occurredAt:
          type: string
          format: date-time
        decisive:
          type: boolean
    SessionArtifactType:
      type: string
      enum:
        - PAGE
        - SEARCH_QUERY
        - DOCUMENTATION
        - GITHUB_REPOSITORY
        - GITHUB_ISSUE
        - DISCUSSION
        - VIDEO
        - AI_CHAT_LINK
        - USER_NOTE_REFERENCE
    ProblemSessionStatus:
      type: string
      enum:
        - CANDIDATE
        - REVIEWABLE
        - SOLVED
        - DISMISSED
        - UNSOLVED
        - DELETED
    ProblemSessionSource:
      type: string
      enum:
        - MANUAL
        - DETECTED
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - code
        - requestId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
  responses:
    BadRequestProblem:
      description: Request body is malformed or semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenProblem:
      description: Authenticated principal is not allowed to perform the operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedProblem:
      description: Bearer access token is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLargeProblem:
      description: Capture batch exceeds the maximum supported event count.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundProblem:
      description: Resource was not found or is not owned by the authenticated user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictProblem:
      description: Current resource state does not permit the requested transition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailedProblem:
      description: Optimistic version precondition is stale.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequiredProblem:
      description: Required optimistic version precondition is missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
